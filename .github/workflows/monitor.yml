name: fx-monitor

# 실행은 Cloudflare Worker(matmap-social-cron)가 10분마다 workflow_dispatch 로 부르는 것뿐이다.
# GitHub 예약 실행(예비)은 기록이 10분에 한 번씩만 찍히도록 뺐다(2026-09-29).
on:
  workflow_dispatch:        # Cloudflare Worker 호출, 또는 텔레그램 기록을 바로 반영하고 싶을 때 수동 실행
    inputs:
      force_signal:
        description: "이번 시간대에 이미 보냈어도 신호 메시지를 다시 보낸다 (테스트용)"
        type: boolean
        default: false
      test_low_shift:
        description: "표 모양 확인용 테스트 메시지를 하위 % 를 이만큼 올려 한 통 더 보낸다 (비우면 안 보냄)"
        type: string
        default: ""
      test_command:
        description: "메시지 답장 확인용 — 아무 말이나 넣으면 메시지를 받은 것처럼 신호 표로 답한다 (비우면 안 보냄)"
        type: string
        default: ""

permissions:
  contents: write           # 암호화 상태 파일 커밋 (매시간 커밋되므로 60일 무활동 자동 비활성화도 걸리지 않는다)
  actions: read             # 같은 시각 중복 호출 확인

concurrency:
  group: fx-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Cloudflare 워커가 같은 예약 시각에 봇을 두 번 부르는 일이 있다(2026-09-29 확인, 몇 초 간격).
      # 90초 안에 먼저 불린 실행이 있으면 이번 실행은 아무것도 안 하고 끝낸다. 테스트 입력을 넣은 수동 실행은 그대로 돈다.
      - name: 중복 호출 확인
        id: dedupe
        if: github.event_name == 'workflow_dispatch' && !inputs.force_signal && inputs.test_low_shift == '' && inputs.test_command == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          me=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at | fromdateiso8601')
          dup=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/runs?event=workflow_dispatch&per_page=10" \
            --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID and ($me - (.created_at | fromdateiso8601)) < 90)] | length")
          if [ "$dup" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::90초 안에 먼저 불린 실행이 있어 건너뜀"; fi

      # 워커가 같은 시각에 두 번 부르면 두 번째 실행은 concurrency 로 기다렸다 돈다. 기본값(부른 시점의 커밋)으로
      # 받으면 앞 실행이 올린 상태를 못 봐서 정기 신호·답장을 한 번 더 보내므로, 실행 시점의 main 끝을 받는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.dedupe.outputs.skip != 'true'
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.dedupe.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.dedupe.outputs.skip != 'true'
        run: pip install -q -r requirements.txt

      - name: Monitor
        if: steps.dedupe.outputs.skip != 'true'
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SIGNAL: ${{ inputs.force_signal && '1' || '' }}
          TEST_LOW_SHIFT: ${{ inputs.test_low_shift }}
          TEST_COMMAND: ${{ inputs.test_command }}
        run: python -m fxbot run

      - name: Commit state
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          git add -A state
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: update encrypted state"
          git pull -q --rebase && git push -q

