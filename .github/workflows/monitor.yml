name: fx-monitor

on:
  schedule:
    # GitHub 예약 실행은 자주 빠진다. 주 실행은 Cloudflare Worker(matmap-social-cron)가
    # 매시 10분·40분에 workflow_dispatch 로 부르고, 이 예약은 그게 멈췄을 때의 예비다.
    - cron: "7,37 * * * *"
  workflow_dispatch:        # Cloudflare Worker 호출, 또는 텔레그램 기록을 바로 반영하고 싶을 때 수동 실행
    inputs:
      force_signal:
        description: "이번 시간대에 이미 보냈어도 신호 메시지를 다시 보낸다 (테스트용)"
        type: boolean
        default: false

permissions:
  contents: write           # 암호화 상태 파일 커밋 (매시간 커밋되므로 60일 무활동 자동 비활성화도 걸리지 않는다)

concurrency:
  group: fx-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Monitor
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SIGNAL: ${{ inputs.force_signal && '1' || '' }}
        run: python -m fxbot run

      - name: Commit state
        run: |
          git add -A state
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: update encrypted state"
          git pull -q --rebase && git push -q

