name: fx-monitor

on:
  schedule:
    # 매시 7분·37분. 붐비는 정각을 피하고, GitHub 이 한 번 건너뛰어도 30분 뒤 실행이 대신한다
    - cron: "7,37 * * * *"
  workflow_dispatch:        # 텔레그램 기록을 바로 반영하고 싶을 때 수동 실행

permissions:
  contents: write           # 암호화 상태 파일 커밋
  actions: write            # 60일 무활동 시 스케줄 자동 비활성화 방지

concurrency:
  group: fx-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Monitor
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fxbot run

      - name: Commit state
        run: |
          git add -A state
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: update encrypted state"
          git pull -q --rebase && git push -q

      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable"
